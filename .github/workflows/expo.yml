name: Expo release

# Run from the Actions tab: pick what to ship.
#   ota         – JS-only update to the production channel (reaches installed builds with the same app version)
#   preview     – internal-distribution build (channel: preview)
#   production  – store build (channel: production)
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to trigger
        type: choice
        required: true
        default: ota
        options:
          - ota
          - preview
          - production
      platform:
        description: Platform (builds and OTA)
        type: choice
        required: true
        default: all
        options:
          - all
          - android
          - ios
      message:
        description: OTA update message (optional)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: expo-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  ota:
    if: inputs.target == 'ota'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Publish OTA update
        run: >
          eas update
          --channel production
          --environment production
          --platform ${{ inputs.platform }}
          --message "${{ inputs.message || github.sha }}"
          --non-interactive

  build:
    if: inputs.target == 'preview' || inputs.target == 'production'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      # --no-wait queues the build on EAS and returns; follow progress on expo.dev.
      - name: Start EAS build
        run: >
          eas build
          --profile ${{ inputs.target }}
          --platform ${{ inputs.platform }}
          --non-interactive
          --no-wait
