name: EAS Update (OTA)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Update channel (matches eas.json build profile channels)'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production
      message:
        description: 'Update message (shows in the EAS dashboard)'
        required: false
        default: 'Manual OTA update'
        type: string

jobs:
  update:
    name: EAS Update (${{ inputs.channel }})
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        run: eas update --channel ${{ inputs.channel }} --message "${{ inputs.message }}" --non-interactive
